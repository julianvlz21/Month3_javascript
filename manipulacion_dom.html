<!-- TASK 1, Estructura base (HTML) -->
<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lista de notas</title>
</head>
<body style="background-color: rgb(28, 21, 32); color: beige; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <header style="display: flex; align-items: center; background-color:#0f030f; height: 3rem; color: beige; box-shadow: 0px 10px 15px rgba(37, 4, 56, 0.507);">
        <h1>Lista de notas</h1>
    </header>
    <main>
        <section style="padding: 1rem; color: beige;">
            <label for="">Agredar nota: </label>
            <input id="nota" type="number" placeholder="0">
            <button id="btn-nota">Agregar</button>
        </section>

        <ul id="listaNotas">

        </ul>
    </main>
    <script>
        // TASK 2, Seleccionar el input y el button
        const boton = document.getElementById("btn-nota");

        function agregarNota() { 
            const nota = document.getElementById("nota");
            const listaNotas = document.getElementById("listaNotas");
            const li = document.createElement("li");
            
            
        // TASK 3, Validación de errores e insertar elementos al HTML
            console.log(nota);
            
            if (!nota.value){
                alert("Por favor ingrese una nota");
                return;                
            }

            listaNotas.appendChild(li);
            li.textContent = nota.value;

            nota.value = "";        
            nota.focus();    

        // TASK 4, Botón eliminar
            const botonEliminar = document.createElement("button");

            botonEliminar.style.margin = "0 1rem";
            botonEliminar.style.padding = "0.3rem";
            botonEliminar.style.border = "none";
            botonEliminar.style.borderRadius = "2px";
            botonEliminar.style.backgroundColor = "#454545";

            botonEliminar.textContent = "❌";
            li.appendChild(botonEliminar);
    
            botonEliminar.addEventListener("click", () => {
                listaNotas.removeChild(li);
            });         
        }

        boton.addEventListener("click", agregarNota);

        
        
    </script>
</body>
</html>
